name: Android tests and coverage

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37 build-tools;37.0.0 ndk;30.0.16248370 cmake;4.1.2'
      - uses: gradle/actions/setup-gradle@v4
      - name: Provision offline dependencies
        run: ./gradlew :app:prepareOfflineTests lint assembleDebugAndroidTest --no-configuration-cache
      - name: Run headless offline checks
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          ./gradlew test lint :app:jacocoDebugUnitReport --offline
          python3 scripts/report_slow_tests.py app/build/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests-and-lint
          path: |
            app/build/reports/
            app/build/test-results/

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37 build-tools;37.0.0 ndk;30.0.16248370 cmake;4.1.2'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Select coverage base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-${PUSH_BASE:-}}"
          if [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ]; then
            base=$(git rev-parse HEAD^)
          fi
          git cat-file -e "$base^{commit}"
          echo "COVERAGE_BASE_REF=$base" >> "$GITHUB_ENV"
      - name: Provision offline dependencies
        run: ./gradlew :app:prepareOfflineTests assembleDebug assembleDebugAndroidTest --no-configuration-cache
      - name: Run offline emulator suites and coverage gates
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            "$ANDROID_HOME/platform-tools/adb" shell cmd connectivity airplane-mode enable
            "$ANDROID_HOME/platform-tools/adb" shell svc wifi disable
            ANDROID_SERIAL=emulator-5554 bash scripts/ci_coverage.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-and-aggregated-coverage
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            build/coverage-baseline/
